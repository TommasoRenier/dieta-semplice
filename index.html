<title>Dieta Semplice</title>
<meta name="description" content="Pasti del giorno, ricette, varianti e lista della spesa secondo il piano alimentare.">

<meta name="theme-color" content="#111A14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: colonna unica da telefono. In alto la striscia dei giorni, al centro i pasti del giorno, in basso le quattro sezioni. */
:root{
  --bg:#F1F3EC; --card:#FFFFFF; --ink:#17251B; --muted:#586A5B; --line:#D8DFD0;
  --accent:#C2402A; --accent-ink:#FFFFFF;
  --ok:#47652A; --ok-bg:#E2EBD1; --warn:#86620A; --warn-bg:#F5EAC4; --bad:#B3321F; --bad-bg:#F8DFD9;
  --f-head:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111A14; --card:#1A261E; --ink:#E8EEE3; --muted:#9BAB9D; --line:#2C3C30;
    --accent:#EE7A63; --accent-ink:#1B0F0C;
    --ok:#A5C56F; --ok-bg:#25351D; --warn:#E3BC4E; --warn-bg:#393114; --bad:#F08A76; --bad-bg:#3B1F1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111A14; --card:#1A261E; --ink:#E8EEE3; --muted:#9BAB9D; --line:#2C3C30;
  --accent:#EE7A63; --accent-ink:#1B0F0C;
  --ok:#A5C56F; --ok-bg:#25351D; --warn:#E3BC4E; --warn-bg:#393114; --bad:#F08A76; --bad-bg:#3B1F1A;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-block:6px 104px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:680px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-head);text-wrap:balance;margin:0;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0 10px}
.brand{font-family:var(--f-head);font-weight:700;font-size:21px;letter-spacing:-.01em}
.date{color:var(--muted);font-size:13px;text-align:right}

.wnav{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px;align-items:center;margin:8px 0 10px}
.wnav .btn{min-height:46px;padding:0;font-size:24px;line-height:1}
.wl{text-align:center}
.wl b{display:block;font-family:var(--f-head);font-size:16px}
.wl small{color:var(--muted);font-size:12.5px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 0 6px;text-align:center;cursor:pointer}
.day small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.day b{display:block;font-family:var(--f-head);font-size:17px;line-height:1.2}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.sel small{color:var(--bg);opacity:.8}
.day.today:not(.sel){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dots{display:flex;gap:3px;justify-content:center;margin-top:4px;height:7px}
.dots span{width:7px;height:7px;border-radius:50%}
.t-pp{background:var(--accent)} .t-pc{background:var(--warn)} .t-pl{background:var(--ok)}
.t-lib{background:transparent;border:1.5px solid var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}

.h2{font-size:24px;line-height:1.15;margin:20px 0 4px}
.sub{color:var(--muted);font-size:14px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.slot-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-pp{background:var(--bad-bg);color:var(--bad)} .p-pc{background:var(--warn-bg);color:var(--warn)}
.p-pl,.p-ok{background:var(--ok-bg);color:var(--ok)} .p-lib,.p-n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.slot h3{font-size:19px;line-height:1.22;margin:8px 0 2px}
.formula{font-size:14px;line-height:1.5;background:var(--bg);border-radius:8px;padding:8px 10px;margin:10px 0 0}
.slot.done h3{text-decoration:line-through;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:44px;font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{min-height:44px;padding:6px 13px;font-size:14px}
.chk{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:4px 6px;min-height:44px;cursor:pointer;font-size:14px;color:var(--muted)}
.tick{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--card)}
.tick svg{width:14px;height:14px;stroke:var(--accent-ink);fill:none;stroke-width:3;opacity:0}
.on>.tick{background:var(--ok);border-color:var(--ok)}
.on>.tick svg{opacity:1}
[data-theme="dark"] .on>.tick svg{stroke:#10190F}

.det{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.det h4{font-size:14px;margin:10px 0 4px}
.ing{list-style:none;padding:0;margin:0;display:grid;gap:0}
.ing li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--line);padding:4px 0;font-size:14px}
.ing .q{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.var{display:grid;gap:6px;margin-top:10px}
.var button{min-height:44px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.var button.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.var small{color:var(--muted);font-size:12px;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.box h3{font-size:17px;margin-bottom:8px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.badge{flex:none;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.wrow{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
.wrow.today{border-color:var(--accent)}
.wd b{display:block;font-family:var(--f-head);font-size:18px;line-height:1.1}
.wd small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ml{display:flex;gap:8px;font-size:13.5px;line-height:1.35;padding:2px 0}
.ml em{font-style:normal;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);width:52px;flex:none;text-transform:uppercase;padding-top:2px}
.ml span{min-width:0}

.seg{display:flex;gap:6px;margin-top:12px}
.seg .btn{flex:1}
.grp{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:20px 0 2px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.item .nm{flex:1;min-width:0}
.item small{display:block;color:var(--muted);font-size:12px}
.item .q{font-family:var(--f-mono);font-size:13px;text-align:right}
.item.on .nm{color:var(--muted);text-decoration:line-through}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--ok)}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.list{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.list.no li::marker{color:var(--bad)} .list.yes li::marker{color:var(--ok)}
.sch{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sch>div{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13.5px}
.sch h4{font-size:14px;margin-bottom:4px}
details{border-top:1px solid var(--line);padding:10px 0}
details summary{cursor:pointer;font-family:var(--f-head);font-weight:600}
details .list{margin-top:8px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:52px;font-size:12px;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--accent);font-weight:600}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.slot,.box{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(3px)}}}
</style>
</head>

/* Schema della dieta: pranzi con carboidrati a giorni alterni, cena libera di sabato (pranzo con proteine) */
const LUN=['pc','pp','pc','pp','pc','pp','pp'];
const CEN=['pp','pl','pp','pl','pp','lib','pl'];
const COL=['cs','ca','cs','cs','ca','cd','cs'];
const weekNum=w=>{const d=wdate(w,0);return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/604800000)};
function genPlan(w,seed){
  const base=(weekNum(w)+seed)*7, used=new Set();
  const pick=(list,i)=>{for(let k=0;k<list.length;k++){const r=list[(i+k)%list.length];if(!used.has(r.id)){used.add(r.id);return r.id}}return list[i%list.length].id};
  const free=t=>BYT(t).filter(r=>!r.pat);
  const ppAll=free('pp'), fish=ppAll.filter(r=>r.pesce), other=ppAll.filter(r=>!r.pesce);
  const days=[];
  for(let d=0;d<7;d++){
    const o=base+d*5;
    const c=pick(BYT(COL[d]),o);
    const lt=LUN[d],dt=CEN[d];
    const l={t:lt,id:lt==='pp'?pick(other,o):pick(free('pc'),o)};
    let dd={t:dt,id:null};
    if(dt==='pp')dd.id=pick((d===2?other:fish),o);
    if(dt==='pl')dd.id=pick(free('pl'),o);
    days.push({c,l,d:dd,s:null});
  }
  return {seed,days};
}
function getPlan(w){const k=wkey(w);if(!S.plans[k]){S.plans[k]=genPlan(w,0);save()}return S.plans[k]}

/* ===== INGREDIENTI, SPESA, CONTROLLI ===== */
function tokens(r){
  let s=r.ing||'';
  if(r.t==='pp')s+=(r.nopane?'':' pane:40')+' olio:3 crude';
  if(r.t==='pc')s+=' olio:2';
  if(r.t==='pl')s+=' olio';
  return s.trim().split(/\s+/).map(t=>{const p=t.split(':');return {id:p[0],q:p[1]?parseFloat(p[1]):0}});
}
const num=q=>q===0.5?'½':(Number.isInteger(q)?String(q):String(Math.round(q*10)/10).replace('.',','));
function fq(id,q){if(!q)return 'q.b.';const u=IT[id][2];return num(q)+(u==='g'?' g':' '+u)}
function shop(plan){
  const A={};
  const add=r=>tokens(r).forEach(t=>{const a=A[t.id]||(A[t.id]={id:t.id,q:0,n:0,qb:0});a.n++;if(t.q)a.q+=t.q;else a.qb++});
  plan.days.forEach(x=>{
    add(RB[x.c]);
    if(x.l.id)add(RB[x.l.id]);
    if(x.d.id)add(RB[x.d.id]);
    if(x.s)add({t:'sp',ing:SB[x.s].ing});
  });
  return Object.values(A).sort((a,b)=>IT[a.id][1]-IT[b.id][1]||IT[a.id][0].localeCompare(IT[b.id][0],'it'));
}
function shopQ(a){
  let t=a.q?fq(a.id,a.q):'q.b.';
  if(a.q&&a.id==='olio')t+=' (circa '+Math.round(a.q*15)+' ml)';
  if(a.q&&a.qb)t+=' + q.b.';
  return t;
}
function checks(plan){
  const D=plan.days,out=[],ok=t=>out.push({ok:1,t}),no=t=>out.push({ok:0,t});
  const c=(f)=>D.filter(f).length;
  const lp=c(x=>x.l.t==='pp'),lc=c(x=>x.l.t==='pc');
  (lp===4&&lc===3)?ok('Pranzi: 4 con proteine e 3 con carboidrati.'):no('Pranzi: '+lp+' con proteine e '+lc+' con carboidrati. Lo schema prevede 4 e 3.');
  let adj=0;for(let i=0;i<6;i++)if(D[i].l.t==='pc'&&D[i+1].l.t==='pc')adj++;
  adj===0?ok('I pranzi con carboidrati sono a giorni alterni.'):no('Due pranzi con carboidrati sono di fila. Vanno a giorni alterni.');
  const dl=c(x=>x.d.t==='pl'),dp=c(x=>x.d.t==='pp'),df=c(x=>x.d.t==='lib');
  (dl>=2&&dl<=3&&dp>=3&&dp<=4&&df===1)?ok('Cene: '+dl+' con legumi o verdure, '+dp+' con proteine, 1 libera.'):no('Cene: '+dl+' legumi/verdure, '+dp+' proteine, '+df+' libere. Servono 2-3 legumi/verdure, 3-4 proteine e 1 libera.');
  const fish=c(x=>x.d.t==='pp'&&x.d.id&&RB[x.d.id].pesce);
  fish>=2?ok('Pesce a cena: '+fish+' volte (almeno 2).'):no('Pesce a cena: '+fish+' volte. Ne servono almeno 2.');
  D.forEach((x,i)=>{if(x.d.t==='lib'&&x.l.t==='pc')no(DOWL[i]+': con la cena libera il pranzo va con le proteine e verdure, non con pasta o cereali.')});
  let pat=0,tonno=0;
  D.forEach(x=>{[x.l,x.d].forEach(y=>{if(y.id){const r=RB[y.id];if(r.pat)pat++;if(r.tonno)tonno+=1}})});
  pat<=1?ok('Patate: '+pat+' su 1 a settimana.'):no('Patate in '+pat+' pasti. Ne è prevista una volta a settimana (250 g a crudo).');
  tonno<=2?ok('Tonno in scatola: '+tonno+' su 2 scatolette a settimana.'):no('Tonno in scatola: '+tonno+' scatolette. Massimo 2 a settimana.');
  return out;
}

const TABS=[['oggi','Oggi'],['sett','Settimana'],['spesa','Spesa'],['regole','Regole']];
const pill=t=>'<span class="pill p-'+t+'">'+TYPE_NAME[t]+'</span>';
const slotType=(day,s)=>s==='c'?RB[day.c].t:day[s].t;

function weekNav(){
  const w=U.w;
  const nm=w===0?'Questa settimana':w===1?'Prossima settimana':w===-1?'Settimana scorsa':w>1?'Tra '+w+' settimane':Math.abs(w)+' settimane fa';
  return '<div class="wnav"><button class="btn" data-a="wk" data-v="-1" aria-label="Settimana precedente">‹</button><div class="wl"><b>'+nm+'</b><small>'+range(w)+'</small></div><button class="btn" data-a="wk" data-v="1" aria-label="Settimana successiva">›</button></div>'+(w!==0?'<div class="row" style="margin-top:0"><button class="btn sm" data-a="today">Torna a oggi</button></div>':'');
}
function ingList(r){
  return '<ul class="ing">'+tokens(r).map(t=>'<li><span>'+IT[t.id][0]+'</span><span class="q">'+fq(t.id,t.q)+'</span></li>').join('')+'</ul>';
}
function slotCard(s){
  const plan=getPlan(U.w),day=plan.days[U.d];
  const t=slotType(day,s),id=s==='c'?day.c:day[s].id,r=id?RB[id]:null;
  const key=wkey(U.w)+'|'+U.d+'|'+s,done=!!S.done[key],ok=U.open[key];
  const label={c:'Colazione',l:'Pranzo',d:'Cena'}[s];
  let h='<section class="slot'+(done?' done':'')+'"><div class="slot-h"><span class="lbl">'+label+'</span>'+pill(t)+'</div>';
  if(t==='lib'){
    h+='<h3>Cena libera</h3><p class="note">Un pasto a settimana è libero, per esempio la pizza. Se la sera hai la pizza, a pranzo mangia il secondo con le verdure e lascia da parte pasta e cereali.</p>';
  }else{
    h+='<h3>'+r.n+'</h3><div class="formula">'+(FORM[t]||('Bevande: '+DRINK[t]))+'</div>';
    if(t==='cs')h+='<p class="note">Le colazioni salate sono fortemente consigliate.</p>';
    if(ok){
      h+='<div class="det"><h4>Ingredienti</h4>'+ingList(r)+'<h4>Come si prepara</h4><ol class="steps">'+r.how.split('|').map(x=>'<li>'+x+'</li>').join('')+'</ol>';
      if(r.note)h+='<p class="note">'+r.note+'</p>';
      if(t==='pp')h+='<p class="note">Aggiungi sempre un piattino di verdure crude. A fine pasto, se non ti gonfia, puoi mangiare un frutto. Le proteine non vanno pesate, i carboidrati sì.</p>';
      if(t==='pl')h+='<p class="note">Se abbini pane integrale, 40 g. I legumi in barattolo di vetro vanno bene. Con carboidrati e legumi insieme dimezza la dose del carboidrato.</p>';
      h+='</div>';
    }
  }
  h+='<div class="row">';
  if(r)h+='<button class="btn" data-a="rec" data-k="'+key+'">'+(ok?'Nascondi ricetta':'Come si prepara')+'</button>';
  h+='<button class="btn'+(U.vs===s?' on':'')+'" data-a="var" data-s="'+s+'">Cambia</button>';
  h+='<button class="chk'+(done?' on':'')+'" data-a="done" data-k="'+key+'" aria-pressed="'+done+'"><span class="tick">'+TICK+'</span>Fatto</button></div>';
  if(U.vs===s)h+=variants(s,t,id);
  return h+'</section>';
}
function variants(s,t,cur){
  const types=s==='c'?['cs','cd','ca']:s==='l'?['pp','pc']:['pp','pl','lib'];
  const vt=U.vt||t;
  let h='<div class="det"><div class="chips">'+types.map(x=>'<button class="btn sm'+(vt===x?' on':'')+'" data-a="vt" data-t="'+x+'">'+TYPE_NAME[x]+'</button>').join('')+'</div>';
  if(vt==='lib')h+='<div class="var"><button data-a="pick" data-s="'+s+'" data-t="lib" data-id=""'+(t==='lib'?' class="cur"':'')+'><span>Cena libera (pizza o quello che preferisci)</span></button></div>';
  else h+='<div class="var">'+BYT(vt).map(r=>'<button data-a="pick" data-s="'+s+'" data-t="'+vt+'" data-id="'+r.id+'"'+(r.id===cur?' class="cur"':'')+'><span>'+r.n+'</span>'+(r.k?'<small>'+r.k+'</small>':'')+'</button>').join('')+'</div>';
  return h+'</div>';
}
function viewOggi(){
  const plan=getPlan(U.w),dt=wdate(U.w,U.d);
  let h=weekNav()+'<div class="days">';
  for(let i=0;i<7;i++){
    const x=plan.days[i],dd=wdate(U.w,i);
    h+='<button class="day'+(i===U.d?' sel':'')+((U.w===0&&i===TODAY_D)?' today':'')+'" data-a="day" data-v="'+i+'" aria-pressed="'+(i===U.d)+'" aria-label="'+DOWL[i]+' '+dd.getDate()+', pranzo '+TYPE_NAME[x.l.t].toLowerCase()+', cena '+TYPE_NAME[x.d.t].toLowerCase()+'"><small>'+DOW[i]+'</small><b>'+dd.getDate()+'</b><div class="dots" aria-hidden="true"><span class="t-'+x.l.t+'"></span><span class="t-'+x.d.t+'"></span></div></button>';
  }
  h+='</div><div class="legend"><span><i class="t-pp"></i>Proteine</span><span><i class="t-pc"></i>Carboidrati</span><span><i class="t-pl"></i>Legumi e verdure</span><span><i class="t-lib"></i>Libera</span></div>';
  h+='<h2 class="h2">'+DOWL[U.d]+' '+dt.getDate()+' '+MONL[dt.getMonth()]+'</h2>';
  h+='<p class="sub">'+(U.w===0&&U.d===TODAY_D?'Oggi. ':'')+'Pranzo '+TYPE_NAME[plan.days[U.d].l.t].toLowerCase()+', cena '+TYPE_NAME[plan.days[U.d].d.t].toLowerCase()+'.</p>';
  h+=slotCard('c')+slotCard('l')+slotCard('d');
  const x=plan.days[U.d];
  h+='<section class="slot"><div class="slot-h"><span class="lbl">Spuntino, solo se hai fame</span></div><div class="chips"><button class="btn sm'+(!x.s?' on':'')+'" data-a="sp" data-id="">Nessuno</button>'+SP.map(s=>'<button class="btn sm'+(x.s===s.id?' on':'')+'" data-a="sp" data-id="'+s.id+'">'+s.n+'</button>').join('')+'</div>'+(x.s&&SB[x.s].note?'<p class="note">'+SB[x.s].note+'</p>':'')+'</section>';
  const tips=['Bevi acqua. Niente bibite zuccherate e niente bibite zero.','Non ridurre l\'olio EVO indicato. Meglio a crudo, in padella senza temperature troppo alte.'];
  if(U.d>=5)tips.push('Nel weekend: 1 bicchiere di alcol.');
  if(U.d<5)tips.push('Durante la settimana niente dolciumi: al loro posto cioccolato fondente.');
  h+='<div class="box"><h3>Da ricordare</h3><ul class="list">'+tips.map(t=>'<li>'+t+'</li>').join('')+'</ul></div>';
  return h;
}
function viewSett(){
  const plan=getPlan(U.w);
  let h='<h2 class="h2">La settimana</h2>'+weekNav();
  h+='<div class="box"><h3>Rispetta la dieta?</h3><ul class="checks">'+checks(plan).map(c=>'<li><span class="badge '+(c.ok?'b-ok':'b-warn')+'">'+(c.ok?'✓':'!')+'</span><span>'+c.t+'</span></li>').join('')+'</ul></div>';
  plan.days.forEach((x,i)=>{
    const nm=y=>y.id?RB[y.id].n:'Cena libera';
    h+='<button class="wrow'+((U.w===0&&i===TODAY_D)?' today':'')+'" data-a="goto" data-v="'+i+'"><div class="wd"><small>'+DOW[i]+'</small><b>'+wdate(U.w,i).getDate()+'</b></div><div><div class="ml"><em>Colaz.</em><span>'+RB[x.c].n+'</span></div><div class="ml"><em>Pranzo</em><span>'+nm(x.l)+' '+pill(x.l.t)+'</span></div><div class="ml"><em>Cena</em><span>'+nm(x.d)+' '+pill(x.d.t)+'</span></div></div></button>';
  });
  h+='<div class="row"><button class="btn" data-a="regen">Rigenera le varianti</button></div>'+sendBtns('plan')+'<p class="note">Tocca un giorno per aprirlo, vedere le ricette e cambiare i pasti. Tipo di pasto e alternanza restano quelli della dieta.</p>';
  return h;
}
function shopText(){
  const k=wkey(U.w),list=shop(getPlan(U.w)).filter(a=>!(S.have[k]||{})[a.id]);
  return 'Spesa '+range(U.w)+'\n'+list.map(a=>'- '+IT[a.id][0]+': '+shopQ(a)).join('\n');
}

function planText(){
  const plan=getPlan(U.w),nm=y=>y.id?RB[y.id].n:'Cena libera';
  return 'Piano '+range(U.w)+'\n\n'+plan.days.map((x,i)=>DOWL[i]+' '+wdate(U.w,i).getDate()+'\n- Colazione: '+RB[x.c].n+'\n- Pranzo: '+nm(x.l)+'\n- Cena: '+nm(x.d)).join('\n\n');
}
function sendBtns(w){
  const lab=w==='plan'?'il piano':'la lista';
  let h='<div class="row"><button class="btn pri" data-a="send" data-w="'+w+'">Invia '+lab+'</button><button class="btn" data-a="copy" data-w="'+w+'">Copia</button></div>';
  if(U.copyW===w&&U.copy==='ok')h+='<p class="note">Testo copiato. Incollalo in una chat.</p>';
  if(U.copyW===w&&U.copy==='fail')h+='<p class="note">Non riesco a copiare in automatico. Seleziona il testo qui sotto.</p><textarea readonly rows="8" style="width:100%;margin-top:6px;font:12px var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px">'+(w==='plan'?planText():shopText())+'</textarea>';
  return h;
}
function clip(t,done){try{navigator.clipboard.writeText(t).then(()=>done('ok'),()=>done('fail'))}catch(e){done('fail')}}
function viewSpesa(){
  const k=wkey(U.w),H=S.have[k]||{},list=shop(getPlan(U.w));
  const need=list.filter(a=>!H[a.id]),got=list.filter(a=>H[a.id]);
  const row=a=>'<button class="item'+(H[a.id]?' on':'')+'" data-a="have" data-id="'+a.id+'" aria-pressed="'+!!H[a.id]+'"><span class="tick">'+TICK+'</span><span class="nm">'+IT[a.id][0]+'<small>'+a.n+(a.n===1?' pasto':' pasti')+'</small></span><span class="q">'+shopQ(a)+'</span></button>';
  let h='<h2 class="h2">Spesa</h2>'+weekNav();
  h+='<div class="box"><b>'+got.length+' di '+list.length+' prodotti già in casa</b><div class="prog"><i style="width:'+Math.round(got.length/list.length*100)+'%"></i></div><p class="note">Tocca un prodotto che hai già: passa tra quelli che ci sono e non lo devi comprare. Le quantità sono per tutti i pasti della settimana.</p>'+sendBtns('shop');
  h+='</div>';
  let last=-1;
  need.forEach(a=>{const c=IT[a.id][1];if(c!==last){h+='<div class="grp">'+CAT[c]+'</div>';last=c}h+=row(a)});
  if(!need.length)h+='<p class="note" style="margin-top:16px">Hai già tutto per questa settimana.</p>';
  if(got.length)h+='<details style="margin-top:18px"><summary>Già in casa ('+got.length+')</summary>'+got.map(row).join('')+'</details>';
  return h;
}
const RULES=`
<h2 class="h2">Le regole della dieta</h2>
<p class="sub">Biotipo surrenalico. Tutto quello che l'app controlla, in un posto solo.</p>
<div class="box"><h3>Schema della settimana</h3><div class="sch">
<div><h4>Pranzo</h4>4 pranzi con proteine: proteina, verdure libere, 40 g pane integrale o cereali, 3 cucchiai di olio.<br>3 pranzi a giorni alterni con 80 g di carboidrato, verdure libere, 2 cucchiai di olio.</div>
<div><h4>Cena</h4>2-3 cene con legumi e/o verdure (legumi cotti 150 g, secchi 70 g).<br>3-4 cene come il pranzo con proteine, pesce almeno 2 volte.<br>1 cena libera.</div>
<div><h4>Spuntini, solo se hai fame</h4>30 g di frutta secca, oppure frutto + frutta secca, oppure yogurt o kefir + cioccolato fondente, oppure 2 quadretti di fondente 85%.</div></div></div>
<div class="box"><h3>Le regole d'oro</h3><ul class="list">
<li>Pesa i carboidrati con cura. Le proteine non vanno pesate: porzione abituale.</li>
<li>I pesi sono a crudo, tranne dove c'è scritto "cotto", come i legumi.</li>
<li>Carboidrati insieme a legumi o minestre: dimezza la dose (80 g di pasta diventano 40 g).</li>
<li>Non ridurre l'olio EVO. Meglio a crudo, o in padella senza temperature troppo alte.</li>
<li>Con la pizza la sera, a pranzo il secondo con le verdure, non la pasta.</li>
<li>Ogni pasto con proteine ha un piattino di verdure crude. A fine pasto un frutto, se non gonfia.</li>
<li>Acqua. Niente bibite zuccherate e niente bibite zero.</li>
<li>Alcol: 1 bicchiere nel weekend. In settimana niente dolciumi, al loro posto cioccolato fondente.</li></ul></div>
<div class="cols">
<div class="box"><h3>Limiti</h3><ul class="list no">
<li>Affettati: mai oltre 100 g.</li><li>Formaggi: 100-150 g a porzione al massimo, evita quelli stagionati.</li>
<li>Tonno e sgombro in scatola: max 2 scatolette a settimana.</li><li>Patate: 1 volta a settimana, 250 g a crudo, meglio dolci.</li>
<li>Uova: 2-3 a porzione, anche più volte a settimana.</li><li>Avocado: mezzo per volta. Olive: 4-5.</li></ul></div>
<div class="box"><h3>Da evitare</h3><ul class="list no">
<li>Pesce spada, tilapia, cozze e vongole.</li><li>Pesce d'allevamento, quando possibile.</li><li>Formaggi stagionati.</li><li>Bibite zuccherate e bibite zero.</li><li>Dolciumi in settimana.</li></ul></div></div>
<div class="box"><h3>Alimenti consentiti</h3>
<details><summary>Carboidrati</summary><ul class="list yes"><li>Grano antico (per esempio Cappelli).</li><li>Pasta integrale, di kamut, di legumi, di farro, di riso integrale, di grano saraceno, di grano duro.</li><li>Cereali: farro, orzo, avena, ideali nelle minestre.</li><li>Riso integrale, basmati, rosso, nero.</li><li>Pseudocereali: grano saraceno, quinoa.</li><li>Legumi: fagioli, piselli, lenticchie, ceci.</li><li>Patate, meglio dolci. Cous cous.</li><li>Polenta: 2-3 fettine se solida, 1 mestolo abbondante se liquida.</li></ul></details>
<details><summary>Proteine</summary><ul class="list yes"><li>Affettati di alta qualità senza conservanti: bresaola, tacchino, pollo, prosciutto cotto.</li><li>Meglio carne bianca, la rossa non è vietata.</li><li>Pesce spesso. Salmone affumicato selvatico. Crostacei con moderazione. Preferisci i pesci piccoli.</li><li>Formaggi: ricotta, fiocchi di latte, caprino fresco, feta, mozzarella, crescenza, stracchino.</li><li>Uova biologiche.</li></ul></details>
<details><summary>Grassi</summary><ul class="list yes"><li>Olio EVO, di lino, di canapa.</li><li>Burro ghee.</li><li>Frutta secca, creme di frutta secca 100% e semi oleosi.</li><li>Avocado, olive.</li><li>Cioccolato fondente almeno 85%.</li></ul></details></div>
<div class="box"><h3>Da chiedere alla dottoressa</h3><ul class="list">
<li>Alcune ricette dei documenti usano parmigiano (frittata, tortini, polpette, frittelle), ma l'elenco dice di evitare i formaggi stagionati.</li>
<li>Patate nelle ricette (frittata, minestre di verza e di porri, branzino) e patate previste 1 volta a settimana: quale vale?</li>
<li>Pranzi con pasta e fagioli o riso e piselli: quanti legumi, oltre alla dose dimezzata del carboidrato?</li>
<li>Il pancake salato non ha ricetta nei documenti.</li></ul></div>
<div class="box"><h3>Su iPhone</h3><ul class="list"><li>Installa: apri l'indirizzo in Safari, tocca Condividi (il quadrato con la freccia) e poi Aggiungi alla schermata Home.</li><li>I tuoi dati restano sul telefono: spunte, varianti e prodotti già in casa.</li><li>Per mandare il piano o la lista a un'altra persona usa il pulsante Invia in Settimana e in Spesa.</li></ul></div>`;
function render(){
  const y=window.scrollY;
  let h='<header class="top"><h1 class="brand">Dieta Semplice</h1><span class="date">'+DOWL[TODAY_D]+' '+NOW.getDate()+' '+MON[NOW.getMonth()]+'</span></header>';
  h+=U.tab==='oggi'?viewOggi():U.tab==='sett'?viewSett():U.tab==='spesa'?viewSpesa():RULES;
  $('#app').innerHTML=h;
  $('#nav').innerHTML=TABS.map(t=>'<button class="'+(U.tab===t[0]?'on':'')+'" data-a="tab" data-v="'+t[0]+'" aria-current="'+(U.tab===t[0])+'">'+ICON[t[0]]+t[1]+'</button>').join('');
  window.scrollTo(0,y);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const D=el.dataset,a=D.a;
  if(a==='tab'){U.tab=D.v;U.vs=null;U.copy=null;U.copyW=null;window.scrollTo(0,0)}
  else if(a==='day'){U.d=+D.v;U.vs=null;U.vt=null}
  else if(a==='today'){U.w=0;U.d=TODAY_D;U.vs=null}
  else if(a==='rec')U.open[D.k]=!U.open[D.k];
  else if(a==='var'){U.vs=U.vs===D.s?null:D.s;U.vt=null}
  else if(a==='vt')U.vt=D.t;
  else if(a==='pick'){const day=getPlan(U.w).days[U.d];if(D.s==='c')day.c=D.id;else day[D.s]={t:D.t,id:D.t==='lib'?null:D.id};U.vs=null;U.vt=null;save();push(wkey(U.w),{days:{[U.d]:dayOut(day)}})}
  else if(a==='done'){const on=!S.done[D.k];if(on)S.done[D.k]=true;else delete S.done[D.k];save();push(D.k.split('|')[0],{done:{[D.k]:on}})}
  else if(a==='sp'){const day=getPlan(U.w).days[U.d];day.s=D.id||null;save();push(wkey(U.w),{days:{[U.d]:dayOut(day)}})}
  else if(a==='wk'){U.w+=+D.v;U.vs=null;U.vt=null;U.copy=null;U.copyW=null}
  else if(a==='goto'){U.d=+D.v;U.tab='oggi';U.vs=null;window.scrollTo(0,0)}
  else if(a==='regen'){const k=wkey(U.w);S.plans[k]=genPlan(U.w,((S.plans[k]||{}).seed||0)+1);save();push(k,null)}
  else if(a==='have'){const k=wkey(U.w);S.have[k]=S.have[k]||{};const on=!S.have[k][D.id];if(on)S.have[k][D.id]=1;else delete S.have[k][D.id];save();push(k,{have:{[D.id]:on}})}
  else if(a==='send'||a==='copy'){
    const txt=D.w==='plan'?planText():shopText();
    U.copyW=D.w;
    const done=r=>{U.copy=r;render()};
    if(a==='send'&&navigator.share){navigator.share({text:txt}).then(()=>done(null),e=>{if(e&&e.name==='AbortError')done(null);else clip(txt,done)})}
    else clip(txt,done);
    return;
  }
  render();
});
render();
